# https://www.getzola.org/documentation/getting-started/configuration/
base_url = "https://dehanjl.me"
title = "dehanjl"
description = "Personal site of Dehan J. Lamprecht — software engineer & ML/AI postgrad."

# Build SASS in sass/ to public/*.css (style.scss -> style.css)
compile_sass = true

# We don't need these for a small personal site; flip on if you want them.
build_search_index = false
generate_feeds = false

[markdown]
# Smart typography: turns -- into en-dashes, straight quotes into curly, etc.
smart_punctuation = true

[markdown.highlighting]
# Syntax highlighting via CSS classes, styled in sass/_code.scss to match the
# burnt-titanium-blue / copper palette.
style = "class"
theme = "github-light"

[extra]
# Put all your custom variables here
